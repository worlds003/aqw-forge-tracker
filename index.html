<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQW Forge Master Tracker v2.0</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-secondary: #141824;
            --bg-card: #1e2436;
            --accent-gold: #ffc107;
            --accent-purple: #a855f7;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #2e374e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 20px; }
        .container { max-width: 1300px; margin: 0 auto; }

        /* HEADER & TIMERS */
        header {
            background: linear-gradient(180deg, rgba(255, 193, 7, 0.15) 0%, rgba(20, 24, 36, 0.95) 100%);
            border: 1px solid var(--accent-gold);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        header h1 { color: var(--accent-gold); font-size: 1.8rem; display: flex; align-items: center; gap: 10px; }
        header p { color: var(--text-muted); font-size: 0.9rem; }

        .timer-badge {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--accent-purple);
            padding: 10px 15px;
            border-radius: 8px;
            text-align: right;
        }
        .timer-badge span { color: var(--accent-purple); font-weight: bold; font-size: 1.1rem; }

        /* PAINEL DE CONTROLE / CONTROLS BAR */
        .controls-bar {
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }

        .search-box { flex: 1; min-width: 250px; position: relative; }
        .search-box input {
            width: 100%;
            padding: 10px 12px 10px 35px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
        }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .filter-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-filter {
            background: var(--bg-primary);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .btn-filter.active { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); }

        .action-buttons { display: flex; gap: 8px; }
        .btn-action {
            background: #334155;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-action:hover { background: #475569; }

        /* SEÇÃO DE FAVORITOS */
        .pinned-section {
            background: rgba(255, 193, 7, 0.05);
            border: 1px dashed var(--accent-gold);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        .pinned-section.active { display: block; }
        .pinned-section h3 { color: var(--accent-gold); font-size: 1rem; margin-bottom: 10px; }

        /* PROGRESS BAR GENERAL */
        .overall-progress-card {
            background: var(--bg-secondary);
            padding: 18px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .progress-bar-bg {
            background: #0f172a;
            height: 24px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
            margin-top: 8px;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #10b981);
            width: 0%;
            transition: width 0.4s ease;
        }
        .progress-text-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-weight: bold; font-size: 0.85rem; text-shadow: 1px 1px 3px #000;
        }

        /* NAVEGAÇÃO POR ABAS */
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn {
            background: var(--bg-secondary);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            display: flex; align-items: center; gap: 8px;
        }
        .tab-btn.active { border-color: var(--accent-gold); background: rgba(255, 193, 7, 0.15); color: var(--accent-gold); }

        /* CARDS E GRID */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .items-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 18px; }

        .item-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .pin-btn {
            position: absolute; top: 12px; right: 12px;
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 1.1rem; transition: color 0.2s;
        }
        .pin-btn.pinned { color: var(--accent-gold); }

        .item-header { padding-right: 25px; margin-bottom: 10px; }
        .item-title { font-size: 1.05rem; font-weight: bold; color: #fff; }
        .item-type { font-size: 0.75rem; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 0.5px; }

        .item-details { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.6; }
        .item-details strong { color: var(--text-main); }

        .btn-copy-join {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            margin-left: 5px;
        }
        .btn-copy-join:hover { background: rgba(59, 130, 246, 0.3); }

        /* CONTROLES DE CONTAGEM */
        .counter-controls {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--bg-secondary); padding: 6px 10px; border-radius: 6px;
        }
        .btn-count {
            background: #334155; color: #fff; border: none;
            width: 30px; height: 30px; border-radius: 4px;
            cursor: pointer; font-weight: bold; font-size: 1rem;
        }
        .count-input {
            width: 65px; text-align: center; background: transparent;
            border: 1px solid var(--border-color); color: #fff;
            padding: 4px; border-radius: 4px; font-weight: bold;
        }

        .card-complete { border-left: 4px solid var(--accent-green); }
        .card-partial { border-left: 4px solid var(--accent-gold); }
        .card-zero { border-left: 4px solid var(--accent-red); }

        /* BLOCO DE NOTAS E MODAIS */
        .notes-container { margin-top: 25px; background: var(--bg-secondary); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); }

            border: 1px solid var(--border-color); color: var(--text-main);

        .modal {

        .modal-content {

        }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 15px; color: var(--accent-gold); }
        .close-modal { cursor: pointer; font-size: 1.2rem; }
    </style>
</head>

let pinnedItems = [];
let currentFilter = 'all';

// TIMER DE RESET SEMANAL (Sexta-feira 00:00 EST)
function updateWeeklyTimer() {
    const now = new Date();
    const nextReset = new Date();
    nextReset.setUTCHours(0, 0, 0, 0);
    nextReset.setUTCDate(now.getUTCDate() + ((5 - now.getUTCDay() + 7) % 7 || 7));

    const diff = nextReset - now;
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

    document.getElementById('weekly-timer').innerText = `${days}d ${hours}h ${minutes}m`;
}
setInterval(updateWeeklyTimer, 60000);
updateWeeklyTimer();

// CARREGAR & SALVAR LOCALSTORAGE
function loadProgress() {
    const saved = localStorage.getItem('aqw_forge_v2_progress');
    if (saved) {
        const parsed = JSON.parse(saved);
        Object.keys(itemsData).forEach(cat => {
            itemsData[cat].forEach(item => {
                if (parsed[item.id] !== undefined) item.current = parsed[item.id];
            });
        });
    }
    const savedPins = localStorage.getItem('aqw_forge_v2_pins');
    if (savedPins) pinnedItems = JSON.parse(savedPins);

    const notes = localStorage.getItem('aqw_forge_v2_notes');
    if (notes) document.getElementById('personal-notes').value = notes;
}

function saveProgress() {
    const toSave = {};
    Object.keys(itemsData).forEach(cat => {
        itemsData[cat].forEach(item => toSave[item.id] = item.current);
    });
    localStorage.setItem('aqw_forge_v2_progress', JSON.stringify(toSave));
    localStorage.setItem('aqw_forge_v2_pins', JSON.stringify(pinnedItems));
    updateOverall();
    renderPinned();
}

function saveNotes() {
    localStorage.setItem('aqw_forge_v2_notes', document.getElementById('personal-notes').value);
}

// COPIAR /JOIN
function copyJoin(map) {
    navigator.clipboard.writeText(map);
    alert(`Comando ${map} copiado para a área de transferência!`);
}

// TOGGLE FAVORITO (PIN)
function togglePin(id) {
    if (pinnedItems.includes(id)) {
        pinnedItems = pinnedItems.filter(p => p !== id);
    } else {
        pinnedItems.push(id);
    }
    saveProgress();
    renderAllCategories();
}

// PLAY SOUND EFFECT (Efeito ao concluir)
function playCompleteSound() {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
    osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); // A5
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}

// RENDERIZAR CARDS
function createCardElement(item, cat) {
    const percentage = Math.min(100, Math.round((item.current / item.max) * 100));
    let statusClass = 'card-zero';
    if (percentage === 100) statusClass = 'card-complete';
    else if (percentage > 0) statusClass = 'card-partial';

    const isPinned = pinnedItems.includes(item.id);
    const hasGuide = guidesData[item.id];

    // Calculadora de tempo para Ultras
    let timeEstimate = '';
    if (item.type.includes('Semanal') && item.current < item.max) {
        const remaining = item.max - item.current;
        const weeks = Math.ceil(remaining / 4);
        timeEstimate = `<div style="color: var(--accent-purple); font-size: 0.78rem; margin-top: 4px;">⏳ Restam aprox. <strong>${weeks} semana(s)</strong> de reset</div>`;
    }

    const card = document.createElement('div');
    card.className = `item-card ${statusClass}`;
    card.setAttribute('data-name', item.name.toLowerCase());
    card.setAttribute('data-status', percentage === 100 ? 'done' : percentage > 0 ? 'partial' : 'pending');

    card.innerHTML = `
        <button class="pin-btn ${isPinned ? 'pinned' : ''}" onclick="togglePin('${item.id}')" title="Fixar no Topo">★</button>
        <div>
            <div class="item-header">
                <div class="item-type">${item.type}</div>
                <div class="item-title">${item.name}</div>
            </div>
            <div class="item-details">
                <div>📍 <strong>Mapa:</strong> ${item.map} <button class="btn-copy-join" onclick="copyJoin('${item.map}')"><i class="fa-regular fa-copy"></i> /join</button></div>
                <div>👤 <strong>NPC:</strong> ${item.npc} | ⚔️ <strong>Monstro:</strong> ${item.monster}</div>
                <div>🎁 <strong>Drop:</strong> ${item.drop}</div>
                ${timeEstimate}
                <div style="margin-top: 6px;">
                    <a href="${item.wiki}" target="_blank" style="color: #60a5fa; font-size: 0.8rem; text-decoration: none;"><i class="fa-solid fa-arrow-up-right-from-square"></i> Wiki</a>
                    ${hasGuide ? `<button class="btn-copy-join" onclick="openGuide('${item.id}')" style="margin-left: 10px; background: rgba(255, 193, 7, 0.2); color: var(--accent-gold); border-color: var(--accent-gold);"><i class="fa-solid fa-shield-halved"></i> Guia de Boss</button>` : ''}
                </div>
            </div>
        </div>
        <div>
            <div style="font-size: 0.8rem; font-weight: bold; margin-bottom: 4px;">Progresso: ${percentage}%</div>
            <div class="counter-controls">
                <button class="btn-count" onclick="updateItem('${cat}', '${item.id}', -1)">-</button>
                <input type="number" class="count-input" value="${item.current}" max="${item.max}" min="0" onchange="setItem('${cat}', '${item.id}', this.value)">
                <span style="color: var(--text-muted); font-size: 0.85rem;">/ ${item.max}</span>
                <button class="btn-count" onclick="updateItem('${cat}', '${item.id}', 1)">+</button>
            </div>
        </div>
    `;
    return card;
}

function renderCategory(cat) {
    const container = document.getElementById(`grid-${cat}`);
    container.innerHTML = '';
    itemsData[cat].forEach(item => {
        container.appendChild(createCardElement(item, cat));
    });
}

function renderAllCategories() {
    Object.keys(itemsData).forEach(renderCategory);
    renderPinned();
    filterItems();
}

function renderPinned() {
    const pinnedSection = document.getElementById('pinned-section');
    const container = document.getElementById('grid-pinned');
    container.innerHTML = '';

    if (pinnedItems.length === 0) {
        pinnedSection.classList.remove('active');
        return;
    }

    pinnedSection.classList.add('active');
    Object.keys(itemsData).forEach(cat => {
        itemsData[cat].forEach(item => {
            if (pinnedItems.includes(item.id)) {
                container.appendChild(createCardElement(item, cat));
            }
        });
    });
}

function updateItem(cat, id, delta) {
    const item = itemsData[cat].find(i => i.id === id);
    if (item) {
        const prev = item.current;
        item.current = Math.max(0, Math.min(item.max, item.current + delta));
        if (item.current === item.max && prev < item.max) playCompleteSound();
        saveProgress();
        renderAllCategories();
    }
}

function setItem(cat, id, val) {
    const item = itemsData[cat].find(i => i.id === id);
    if (item) {
        const prev = item.current;
        item.current = Math.max(0, Math.min(item.max, parseInt(val) || 0));
        if (item.current === item.max && prev < item.max) playCompleteSound();
        saveProgress();
        renderAllCategories();
    }
}

function updateOverall() {
    let totalMax = 0, totalCurrent = 0;
    Object.keys(itemsData).forEach(cat => {
        itemsData[cat].forEach(item => {
            totalMax += item.max;
            totalCurrent += item.current;
        });
    });
    const pct = totalMax > 0 ? Math.round((totalCurrent / totalMax) * 100) : 0;
    document.getElementById('overall-percentage').innerText = `${pct}%`;
    document.getElementById('overall-bar').style.width = `${pct}%`;
    document.getElementById('overall-text').innerText = `${totalCurrent} de ${totalMax} Reagentes/Itens Obavidos`;
}

// FILTROS & BUSCA
function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterItems();
}

function filterItems() {
    const query = document.getElementById('search-input').value.toLowerCase();
    document.querySelectorAll('.item-card').forEach(card => {
        const name = card.getAttribute('data-name');
        const status = card.getAttribute('data-status');
        const matchesQuery = name.includes(query);
        const matchesStatus = (currentFilter === 'all') || (currentFilter === status);

        if (matchesQuery && matchesStatus) {
            card.style.display = 'flex';
        } else {
            card.style.display = 'none';
        }
    });
}

function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
    document.getElementById(`tab-${tabId}`).classList.add('active');
}

// MODAL GUIDES
function openGuide(id) {
    const guide = guidesData[id];
    if (guide) {
        document.getElementById('modal-title').innerText = guide.title;
        document.getElementById('modal-body').innerHTML = guide.text;
        document.getElementById('guide-modal').style.display = 'flex';
    }
}
function closeModal() { document.getElementById('guide-modal').style.display = 'none'; }

// EXPORTAR & IMPORTAR
function exportData() {
    const data = {
        progress: localStorage.getItem('aqw_forge_v2_progress'),
        pins: localStorage.getItem('aqw_forge_v2_pins'),
        notes: localStorage.getItem('aqw_forge_v2_notes')
    };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `AQW_Forge_Backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
}

function importData(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = JSON.parse(e.target.result);
            if (data.progress) localStorage.setItem('aqw_forge_v2_progress', data.progress);
            if (data.pins) localStorage.setItem('aqw_forge_v2_pins', data.pins);
            if (data.notes) localStorage.setItem('aqw_forge_v2_notes', data.notes);
            loadProgress();
            renderAllCategories();
            alert('Backup restaurado com sucesso!');
        };
        reader.readAsText(file);
    }
}

// INICIALIZAÇÃO
loadProgress();
renderAllCategories();
</script>
</body>
</html>
